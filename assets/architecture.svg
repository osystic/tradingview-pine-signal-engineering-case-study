<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">TradingView Pine Script signal engineering architecture</title>
  <desc id="desc">Sanitized flow from chart data through moving-average and alternate-resolution processing to signal labels, strategy entries, and configurable alerts.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2744">PUBLIC SHOWCASE ARCHITECTURE</text>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="16" fill="#52677d">Sanitized signal path · no client source code, configuration, or infrastructure</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#102a43">
    <rect x="50" y="155" width="170" height="94" rx="12" fill="#eaf2f8" stroke="#9fb3c8"/>
    <text x="135" y="194" font-size="16" font-weight="700">Chart OHLC</text>
    <text x="135" y="220" font-size="14">confirmed bar data</text>

    <rect x="258" y="155" width="190" height="94" rx="12" fill="#dceefb" stroke="#829ab1"/>
    <text x="353" y="190" font-size="16" font-weight="700">MA variants</text>
    <text x="353" y="216" font-size="14">period · offsets</text>

    <rect x="486" y="155" width="210" height="94" rx="12" fill="#eaf2f8" stroke="#9fb3c8"/>
    <text x="591" y="190" font-size="16" font-weight="700">Alternate resolution</text>
    <text x="591" y="216" font-size="14">chart TF × multiplier</text>

    <rect x="734" y="155" width="190" height="94" rx="12" fill="#dceefb" stroke="#829ab1"/>
    <text x="829" y="190" font-size="16" font-weight="700">Cross events</text>
    <text x="829" y="216" font-size="14">over · under</text>

    <rect x="962" y="155" width="188" height="94" rx="12" fill="#eaf2f8" stroke="#9fb3c8"/>
    <text x="1056" y="190" font-size="16" font-weight="700">Signal-state gate</text>
    <text x="1056" y="216" font-size="14">final eligibility</text>
  </g>

  <g stroke="#627d98" stroke-width="3" fill="none">
    <path d="M220 202 H258"/><path d="M448 202 H486"/><path d="M696 202 H734"/><path d="M924 202 H962"/>
  </g>
  <g fill="#627d98">
    <polygon points="250,196 250,208 259,202"/><polygon points="478,196 478,208 487,202"/>
    <polygon points="726,196 726,208 735,202"/><polygon points="954,196 954,208 963,202"/>
  </g>

  <path d="M1056 249 V316" stroke="#627d98" stroke-width="3" fill="none"/>
  <polygon points="1050,308 1062,308 1056,317" fill="#627d98"/>
  <text x="1056" y="294" font-family="Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">BUY / SELL EVENT</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#102a43">
    <rect x="215" y="380" width="230" height="100" rx="12" fill="#edf7ed" stroke="#8fbf8f"/>
    <text x="330" y="418" font-size="16" font-weight="700">Chart labels</text>
    <text x="330" y="445" font-size="14">BUY · SELL only</text>

    <rect x="485" y="380" width="230" height="100" rx="12" fill="#fff7e6" stroke="#d4a72c"/>
    <text x="600" y="418" font-size="16" font-weight="700">Strategy entries</text>
    <text x="600" y="445" font-size="14">long · short events</text>

    <rect x="755" y="380" width="230" height="100" rx="12" fill="#eaf2f8" stroke="#829ab1"/>
    <text x="870" y="418" font-size="16" font-weight="700">Configurable alerts</text>
    <text x="870" y="445" font-size="14">BUY · SELL messages</text>
  </g>

  <path d="M1056 317 C1056 348 870 348 870 380" stroke="#627d98" stroke-width="3" fill="none"/>
  <path d="M1056 317 C1056 356 600 348 600 380" stroke="#627d98" stroke-width="3" fill="none"/>
  <path d="M1056 317 C1056 364 330 348 330 380" stroke="#627d98" stroke-width="3" fill="none"/>

  <rect x="60" y="515" width="1080" height="1" fill="#d9e2ec"/>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="13" fill="#6b7c93">Known trade-off: inherited higher-timeframe lookahead behavior was retained for requested signal parity; this is not a non-repainting claim.</text>
</svg>
